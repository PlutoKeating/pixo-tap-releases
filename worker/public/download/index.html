<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="" />
  <title>PIXO TAP</title>
  <script type="module" crossorigin src="./assets/main-qbzeNcd2.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/shared-Cr3QjocV.js">
  <link rel="stylesheet" crossorigin href="./assets/shared-Dsq90fkh.css">
</head>
<body data-title-key="title" data-releases-repo="">
  <header class="top">
    <a class="brand" href="/">PIXO TAP</a>
    <label class="lang"><span class="sr-only" data-i18n="language"></span>
      <select id="lang"><option value="zh">中文</option><option value="en">English</option></select>
    </label>
  </header>
  <main>
    <section class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p class="lead" data-i18n="heroLead"></p>
    </section>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <section id="state" class="panel" hidden></section>
    <div id="content" hidden>
      <section id="primary" class="panel primary"></section>
      <section>
        <h2 data-i18n="allPlatforms"></h2>
        <div id="platforms" class="grid"></div>
      </section>
      <details id="others" class="panel" hidden></details>
      <section id="verify-help" class="panel"></section>
      <section id="notes" class="panel"></section>
    </div>
    <p><a href="./history/" data-i18n="historyLink"></a></p>
    <p id="source" class="muted small"></p>
  </main>
</body>
</html>
